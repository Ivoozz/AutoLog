name: Build iOS IPA (AutoLog)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
          fi
          echo "Active Xcode: $(xcode-select -p)"
          xcodebuild -version


      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild -project AutoLog.xcodeproj \
            -scheme AutoLog \
            -destination "generic/platform=iOS" \
            -configuration Release \
            archive \
            -archivePath build/AutoLog.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/AutoLog.xcarchive/Products/Applications/AutoLog.app Payload/
          zip -r AutoLog.ipa Payload
          cp AutoLog.ipa AutoLog-v1.6.0.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoLog-iOS-App
          path: |
            AutoLog.ipa
            AutoLog-v1.6.0.ipa
          retention-days: 14
