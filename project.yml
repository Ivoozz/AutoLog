name: AutoLog
options:
  bundleIdPrefix: nl.ivoozz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  AutoLog:
    type: application
    platform: iOS
    sources:
      - path: AutoLog
    info:
      path: AutoLog/Info.plist
      properties:
        CFBundleDisplayName: "AutoLog"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - bluetooth-central
          - processing
          - fetch
        NSLocationWhenInUseUsageDescription: "AutoLog gebruikt je locatie om automatisch ritten vast te leggen."
        NSLocationAlwaysAndWhenInUseUsageDescription: "AutoLog heeft continu locatietoegang nodig om ritten automatisch te registreren wanneer CarPlay of Bluetooth verbindt."
        NSBluetoothAlwaysUsageDescription: "AutoLog gebruikt Bluetooth om te detecteren wanneer je in je werk- of privéauto stapt."
        NSBluetoothPeripheralUsageDescription: "AutoLog gebruikt Bluetooth om verbinding met je voertuig te herkennen."
        NSMotionUsageDescription: "AutoLog gebruikt bewegingssensoren om autoritten nauwkeurig te registreren."
